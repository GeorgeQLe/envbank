name: Release v0.2.0

on:
  push:
    tags:
      - v0.2.0

permissions:
  contents: read

env:
  VERSION: v0.2.0
  IMAGE: ghcr.io/georgeqle/envbank

jobs:
  release-gates:
    name: Release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Validate annotated tag on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "$VERSION"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .protected)" = true
          tag_object="$(git ls-remote --tags origin "refs/tags/$VERSION" | awk '{print $1}')"
          tag_commit="$(git ls-remote --tags origin "refs/tags/$VERSION^{}" | awk '{print $1}')"
          test -n "$tag_object"
          test -n "$tag_commit"
          test "$tag_object" != "$tag_commit"
          test "$tag_commit" = "$GITHUB_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Quality and tests
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          go mod tidy -diff
          go test ./...
          go test -race ./...
          go vet ./...
          node --test extension/test/*.test.js
          make recovery-drill
          make build-cross
      - name: Vulnerability audit
        run: go run golang.org/x/vuln/cmd/govulncheck@19b0bb6a272792b9afa8a6983c3e9b9a1816947f ./... # v1.6.0
      - name: Dependency license audit
        run: >
          go run github.com/google/go-licenses/v2@3e084b0caf710f7bfead967567539214f598c0a2 check ./...
          --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  macos-test:
    name: Release tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  build-archives:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs:
      - release-gates
      - macos-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            cgo: "1"
          - goos: darwin
            goarch: arm64
            runner: macos-15
            cgo: "1"
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            cgo: "0"
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            cgo: "0"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          build_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          archive="envbank_0.2.0_${GOOS}_${GOARCH}"
          mkdir "$archive"
          go build -trimpath \
            -ldflags="-s -w -X main.version=$VERSION -X main.commit=$GITHUB_SHA -X main.buildDate=$build_date" \
            -o "$archive/envbank" ./cmd/envbank
          "$archive/envbank" version | grep -F "envbank $VERSION (commit $GITHUB_SHA, built $build_date)"
          if [[ "$GOOS" == darwin ]]; then
            otool -L "$archive/envbank" | grep -F Security.framework
          fi
          go version -m "$archive/envbank"
          cp LICENSE README.md "$archive/"
          tar -czf "$archive.tar.gz" "$archive"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: envbank-${{ matrix.goos }}-${{ matrix.goarch }}
          path: envbank_0.2.0_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  artifacts:
    name: Checksums, SBOM, and artifact provenance
    needs: build-archives
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: envbank-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum envbank_*.tar.gz > SHA256SUMS
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Generate SPDX JSON dependency SBOM
        run: syft dir:. -o spdx-json=dist/envbank_0.2.0_sbom.spdx.json
      - id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: |
            dist/envbank_*.tar.gz
            dist/SHA256SUMS
            dist/envbank_0.2.0_sbom.spdx.json
      - name: Preserve artifact provenance bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" dist/envbank_0.2.0_artifacts.provenance.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  image:
    name: Multi-architecture image and provenance
    needs:
      - release-gates
      - macos-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve reproducible build date
        id: metadata
        run: echo "build_date=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/georgeqle/envbank:v0.2.0
            ghcr.io/georgeqle/envbank:0.2
          build-args: |
            VERSION=v0.2.0
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
      - id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-name: ghcr.io/georgeqle/envbank
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-version: v0.2.0
          push-to-registry: true
      - name: Preserve image provenance bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" envbank_0.2.0_image.provenance.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-provenance
          path: envbank_0.2.0_image.provenance.json
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease
    needs:
      - artifacts
      - image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-provenance
          path: dist
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $VERSION already exists; refusing to modify it" >&2
            exit 1
          fi
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "EnvBank v0.2.0 alpha" \
            --notes-file .github/release-notes-v0.2.0.md \
            --prerelease \
            --verify-tag
