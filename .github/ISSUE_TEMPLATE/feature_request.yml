name: Feature request
description: Propose a non-sensitive improvement.
title: "feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, use
        [private vulnerability reporting](https://github.com/GeorgeQLe/envbank/security/advisories/new)
        instead of this form.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Include security, compatibility, and operational implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
