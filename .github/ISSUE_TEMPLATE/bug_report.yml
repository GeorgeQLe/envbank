name: Bug report
description: Report a reproducible non-security defect.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities or include secrets here. Use
        [private vulnerability reporting](https://github.com/GeorgeQLe/envbank/security/advisories/new).
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This report does not describe a security vulnerability and contains no secrets.
          required: true
  - type: input
    id: version
    attributes:
      label: EnvBank version
      description: Paste the output of `envbank version`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS AMD64
        - macOS ARM64
        - Linux AMD64
        - Linux ARM64
        - Source build
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior without sensitive data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal sequence using dummy data only.
    validations:
      required: true
