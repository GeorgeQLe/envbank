title = "EnvBank Gitleaks configuration"
minVersion = "8.24.3"

[extend]
useDefault = true

[allowlist]
description = "Known public and symbolic values documented in the repository"
regexTarget = "line"
regexes = [
  '''vault_key, "envbank\.record\.id\.v1"''',
  '''MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A.*KetWyvjJojHjmtA6kwIDAQAB''',
]
