title = "EnvBank Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Public Chrome extension manifest key"
regexTarget = "line"
regexes = [
  '''\\E''',
]

[[allowlists]]
description = "Symbolic HMAC architecture example"
regexTarget = "match"
regexes = [
  '''vault_key, "envbank\.record\.id\.v1"''',
]
